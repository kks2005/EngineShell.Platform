name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Managed build and tests
    uses: ./.github/workflows/managed-ci.yml

  coverage:
    name: Managed and native coverage
    uses: ./.github/workflows/coverage-ci.yml
