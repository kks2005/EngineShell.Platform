name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_coverage:
        description: Run managed and native code coverage
        required: false
        default: false
        type: boolean
      run_ui:
        description: Run desktop UI tests on a GitHub-hosted Windows VM
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shared binaries
    uses: ./.github/workflows/build-ci.yml

  managed:
    name: Verify managed tests
    needs: build
    uses: ./.github/workflows/managed-ci.yml

  ui:
    name: Validate desktop UI clients
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui }}
    uses: ./.github/workflows/ui-ci.yml

  coverage:
    name: Measure managed and native coverage
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_coverage }}
    uses: ./.github/workflows/coverage-ci.yml