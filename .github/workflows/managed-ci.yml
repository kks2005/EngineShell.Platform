name: Managed CI

on:
  workflow_call:

jobs:
  test:
    name: Run unit, workflow, headless, and CLI tests
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download CI build
        uses: actions/download-artifact@v7
        with:
          name: ci-build
          path: .

      - name: Run managed tests
        shell: pwsh
        run: |
          $projects = [ordered]@{
            "application-unit" = "tests/Unit/Application.Tests/Application.Tests.csproj"
            "presentation-unit" = "tests/Unit/Presentation.Tests/Presentation.Tests.csproj"
            "cli-client-unit" = "tests/Unit/CliClient.Tests/CliClient.Tests.csproj"
            "workflow" = "tests/Integration/Workflow.Tests/Integration.Tests.csproj"
            "headless" = "tests/Headless/Headless.Tests.csproj"
          }

          foreach ($entry in $projects.GetEnumerator()) {
            dotnet test $entry.Value `
              --configuration Debug `
              --no-build `
              --logger "trx;LogFileName=$($entry.Key).trx" `
              --results-directory "artifacts/test-results/$($entry.Key)"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Smoke test CLI workflow
        shell: pwsh
        run: |
          dotnet run `
            --project src/Clients/CliClient/CliClient.csproj `
            --configuration Debug `
            --no-build `
            -- process ci-input.dat --output ci-output.dat

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Managed test results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
